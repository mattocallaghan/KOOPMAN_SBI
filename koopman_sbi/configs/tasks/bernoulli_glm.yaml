task:
  name: "bernoulli_glm"
  seed: 0
  num_train_samples: 100000
  simulation_batch_size: 256
  train_fraction: 0.8
  use_cached_dataset: false
  dataset_dir: null

model:
  flow_matching:
    sigma_min: 0.0001
    time_prior_exponent: 4.0
    integration_steps: null
    atol: 0.00001
    rtol: 0.00001
    network:
      type: "DenseResidualNet"
      hidden_dims: [64, 256, 1024, 256, 64]
      activation: "gelu"
      batch_norm: false
      dropout: 0.0
      theta_with_glu: false
      context_with_glu: false
  koopman:
    lifting_dim: 256
    lambda_rec: 1.0
    lambda_lat: 1.0
    lambda_pred: 1.0
    network:
      type: "DenseResidualNet"
      hidden_dims: [64, 256, 1024, 256, 64]
      activation: "gelu"
      batch_norm: false
      dropout: 0.0
      theta_with_glu: false
      context_with_glu: false
  npe:
    backend: "normflows"
    num_coupling_layers: 5
    transform: "affine"
    permutation: "swap"
    use_actnorm: false
    base_distribution: "normal"
    network:
      type: "DenseResidualNet"
      hidden_dims: [32, 32, 32]
      activation: "gelu"
      batch_norm: false
      dropout: 0.0
      theta_with_glu: false
      context_with_glu: false
  cmpe:
    eps: 0.001
    t_max: 200.0
    rho: 7.0
    sigma_data: 1.0
    s0: 10
    s1: 50
    p_mean: -1.1
    p_std: 2.0
    default_num_steps: 10
    network:
      type: "DenseResidualNet"
      hidden_dims: [256, 256, 256, 256, 256]
      activation: "relu"
      batch_norm: false
      dropout: 0.0
      theta_with_glu: false
      context_with_glu: false

teacher:
  checkpoint_path: "logs/bernoulli_glm/last_model/train_flow/best_model.pt"
  auto_train_if_missing: true
  num_samples: 100000
  num_context: 2000
  batch_size: 64
  cache_trajectories: true
  load_cached_trajectories: true
  trajectory_dir: null

training:
  flow_matching:
    batch_size: 64
    epochs: 200
    num_workers: 0
    device: "auto"
    early_stopping: true
    patience: 20
    gradient_clip_norm: null
    precision: "float32"
    use_tensorboard: true
    optimizer:
      name: "Adam"
      lr: 0.001
      weight_decay: 0.00001
    scheduler:
      type: "reduce_on_plateau"
      factor: 0.5
      patience: 5
      step_size: 10
      gamma: 0.5
  koopman:
    batch_size: 128
    epochs: 200
    num_workers: 0
    device: "auto"
    early_stopping: true
    patience: 10
    gradient_clip_norm: null
    precision: "float32"
    use_tensorboard: true
    optimizer:
      name: "Adam"
      lr: 0.001
      weight_decay: 0.00001
    scheduler:
      type: "reduce_on_plateau"
      factor: 0.5
      patience: 5
      step_size: 10
      gamma: 0.5
  npe:
    batch_size: 128
    epochs: 200
    num_workers: 0
    device: "auto"
    early_stopping: true
    patience: 10
    early_stopping_min_delta: 0.005
    gradient_clip_norm: null
    precision: "float32"
    use_tensorboard: true
    optimizer:
      name: "Adam"
      lr: 0.0005
      weight_decay: 0.0
    scheduler:
      type: "reduce_on_plateau"
      factor: 0.5
      patience: 5
      step_size: 10
      gamma: 0.5
  cmpe:
    batch_size: 128
    epochs: 200
    num_workers: 0
    device: "auto"
    early_stopping: true
    patience: 100
    early_stopping_min_delta: 0.005
    gradient_clip_norm: null
    precision: "float32"
    use_tensorboard: true
    optimizer:
      name: "AdamW"
      lr: 0.0001
      weight_decay: 0.0
    scheduler:
      type: "StepLR"
      factor: 0.5
      patience: 5
      step_size: 1
      gamma: 1.0

evaluation:
  num_posterior_samples: 1000
  observations: [1, 2, 3]
  metrics: ["c2st", "mmd", "posterior_mean_error", "posterior_variance_ratio"]
  flow_checkpoint_path: "logs/bernoulli_glm/last_model/train_flow/best_model.pt"
  koopman_checkpoint_path: "logs/bernoulli_glm/last_model/distill_koopman/best_model.pt"
  npe_checkpoint_path: "logs/bernoulli_glm/last_model/train_npe/best_model.pt"
  cmpe_checkpoint_path: "logs/bernoulli_glm/last_model/train_cmpe/best_model.pt"
  include_npe: false
  save_observation_plots: true

logging:
  output_root: "logs"
  run_name: null
  use_tensorboard: true
  use_wandb: false
  wandb_project: "koopman-sbi"
  wandb_run_name: null
  wandb_tags: []

benchmark_suite:
  variants:
    - name: "npe"
      model_type: "npe"
      sample_kwargs: {}
    - name: "fmnpe_dopri5"
      model_type: "flow_matching"
      sample_kwargs:
        solver: "dopri5"
        atol: 0.00001
        rtol: 0.00001
    - name: "fmnpe_rk4_10"
      model_type: "flow_matching"
      sample_kwargs:
        solver: "rk4"
        integration_steps: 10
    - name: "fmnpe_rk4_100"
      model_type: "flow_matching"
      sample_kwargs:
        solver: "rk4"
        integration_steps: 100
    - name: "fmnpe_rk4_1000"
      model_type: "flow_matching"
      sample_kwargs:
        solver: "rk4"
        integration_steps: 1000
    - name: "cmpe_10"
      model_type: "cmpe"
      sample_kwargs:
        num_steps: 10
    - name: "cmpe_100"
      model_type: "cmpe"
      sample_kwargs:
        num_steps: 100
    - name: "koopman"
      model_type: "koopman"
      sample_kwargs: {}
