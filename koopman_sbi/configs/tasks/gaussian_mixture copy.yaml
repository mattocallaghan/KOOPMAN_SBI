# Experimental: overrides the global defaults for the tensor-product Koopman study.

task:
  name: gaussian_mixture
  dataset_dir: logs/gaussian_mixture/shared/dataset_v2
model:
  koopman:
    network:
      hidden_dims: [88, 360, 1432, 360, 88]
    lifting_dim: 256
    adversarial:
      enabled: false
      lambda_adv: 0.01
  # Tuned on gaussian_mixture; see GAUSSIAN_MIXTURE_TENSORPRODUCT_KOOPMAN.md for what was tried and how to revert.
  tensorproduct_koopman:
    use_time_dependent_consistency: false
    lambda_ae: 0.0
    lambda_lat: 0.0
    tensor_rank: 128
  nsf:
    network:
      hidden_dims: [425, 425, 425]
  cmpe:
    network:
      hidden_dims: [256, 256, 256, 256, 256]
teacher:
  generate_trajectories: true
  num_samples: 100000
  num_context: 50000
  batch_size: 128
training:
  tensorproduct_koopman:
    epochs: 100
    gradient_clip_norm: 1.0
benchmark_suite:
  train_flow_matching: true
